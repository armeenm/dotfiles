name: cloudflared
description: Cloudflare's command-line tool and agent
persistentflags:
  --output=: output format for the logs
  --proxy-dns: enable the DNS proxy
  --proxy-dns-port=: DNS proxy port
  --proxy-dns-address=: DNS proxy listen address
  --proxy-dns-upstream=*: DNS proxy upstream
  --proxy-dns-max-upstream-conns=: maximum upstream connections
  --proxy-dns-bootstrap=*: DNS proxy bootstrap
  --credentials-file=: filepath at which to read or write the tunnel credentials
  --cred-file=: filepath at which to read or write the tunnel credentials
  --region=: Cloudflare Edge region to connect to
  --edge-ip-version=: Cloudflare Edge IP address version
  --edge-bind-address=: bind address for outgoing connections
  --label=: meaningful label for this connector
  --post-quantum: create an experimental post-quantum secure tunnel
  --pq: create an experimental post-quantum secure tunnel
  --management-diagnostics: enable in-depth diagnostic routes
  -h, --help: show help
  -v, --version: print the version
  -V: print the version
completion:
  flag:
    output: ["default", "json"]
    edge-ip-version: ["4", "6", "auto"]
commands:
  - name: update
    description: Update the agent if a new version exists
    flags:
      --beta: update to the latest beta version
      --version=: version to upgrade or downgrade to

  - name: version
    description: Print the version
    flags:
      -s, --short: print just the version number

  - name: tail
    description: Stream logs from a remote cloudflared
    flags:
      --connector-id=: access a specific cloudflared instance by connector id
      --event=*: filter by specific events
      --level=: filter by specific log levels
      --sample=: sample log events by percentage
      --token=: access token for a specific tunnel
      --loglevel=: application logging level
      --origincert=: path to the origin certificate
    completion:
      flag:
        level: ["debug", "info", "warn", "error"]
        event: ["cloudflared", "http", "tcp", "udp"]
        loglevel: ["debug", "info", "warn", "error", "fatal"]

  - name: service
    description: Manage the cloudflared system service
    commands:
      - name: install
        description: Install cloudflared as a system service
      - name: uninstall
        description: Uninstall the cloudflared service

  - name: access
    description: Interact with Access protected applications
    aliases: [forward]
    flags:
      --fedramp: use when performing operations in a fedramp account
    commands:
      - name: login
        description: Log in to an Access application
        flags:
          -q, --quiet: do not print the jwt
          --no-verbose: print only the jwt to stdout
          --auto-close: automatically close the auth interstitial
          --app=: Access application
      - name: curl
        description: Curl through an Access application
      - name: token
        description: Print a JWT for an Access application
        flags:
          --app=: Access application
      - name: tcp
        description: Send data over a proxy to the Cloudflare edge
        flags: &access-proxy-flags
          -T, --hostname=: hostname of your application
          --tunnel-host=: hostname of your application
          --destination=: destination address
          -L, --url=: host:port to forward data to the Cloudflare edge
          --listener=: host:port to forward data to the Cloudflare edge
          -H, --header=*: additional headers
          --service-token-id=: Access service token ID
          --id=: Access service token ID
          --service-token-secret=: Access service token secret
          --secret=: Access service token secret
          --logfile=: save application log to this file
          --log-directory=: save application log to this directory
          --log-level=: application logging level
          --loglevel=: application logging level
      - name: rdp
        description: Send RDP data over a proxy to the Cloudflare edge
        flags: *access-proxy-flags
      - name: ssh
        description: Send SSH data over a proxy to the Cloudflare edge
        flags: *access-proxy-flags
      - name: smb
        description: Send SMB data over a proxy to the Cloudflare edge
        flags: *access-proxy-flags
      - name: ssh-config
        description: Print an SSH config for an Access application
      - name: ssh-gen
        description: Generate an SSH key for an Access application

  - name: tunnel
    description: Expose private services through Cloudflare Tunnel
    persistentflags:
      --config=: specifies a config file in YAML format
      --origincert=: path to the certificate generated by tunnel login
      --autoupdate-freq=: autoupdate frequency
      --no-autoupdate: disable periodic update checks
      --no-prechecks: skip connectivity pre-checks at startup
      --metrics=: listen address for metrics reporting
      --pidfile=: write the PID to this file after first successful connection
      --loglevel=: application logging level
      --logfile=: save application log to this file
      --log-directory=: save application log to this directory
      --trace-output=: name of trace output file
    flags:
      --url=: connect to the local webserver at URL
      --hello-world: run the Hello World server
      --socks5: run the tunnel as a SOCKS5 server
      --hostname=: set a hostname on a Cloudflare zone
      --lb-pool=: name of a load balancing pool
      --unix-socket=: path to a unix socket instead of --url
      --no-tls-verify: disable TLS verification of the origin
      --http2-origin: enable HTTP/2 origin servers
      --bastion: run as jump host
      -n, --name=: stable name to identify the tunnel
      --grace-period=: grace period before shutdown
      --retries=: maximum number of retries
    completion:
      flag:
        loglevel: ["debug", "info", "warn", "error", "fatal"]
    commands:
      - name: login
        description: Generate a configuration file with your login details
        flags:
          --loginURL=: URL used to login
          --callbackURL=: URL used for the callback
          -f, --fedramp: login with FedRAMP High environment
      - name: create
        description: Create a new tunnel with the given name
        flags:
          --output=: render output using the given format
          --credentials-file=: filepath at which to read or write the credentials
          --cred-file=: filepath at which to read or write the credentials
          -s, --secret=: base64 encoded secret to set for the tunnel
      - name: route
        description: Define how traffic is routed to this tunnel
        commands:
          - name: dns
            description: Route a hostname by creating a DNS CNAME record
            flags:
              -f, --overwrite-dns: overwrite existing DNS records
          - name: lb
            description: Use this tunnel as a load balancer origin
          - name: ip
            description: Configure WARP routing to private IP networks
            commands:
              - name: add
                description: Add a new network to the routing table
              - name: show
                description: Show the routing table
                aliases: [list]
              - name: delete
                description: Delete a row from the private routing table
              - name: get
                description: Check which routing table row matches a given IP
      - name: vnet
        description: Configure and query virtual networks
        commands:
          - name: add
            description: Add a new virtual network
            flags:
              -d, --default: make this the default virtual network
          - name: list
            description: List the virtual networks
          - name: delete
            description: Delete a virtual network
          - name: update
            description: Update a virtual network
      - name: run
        description: Proxy a local web server by running the given tunnel
        flags:
          --credentials-file=: filepath at which to read or write the credentials
          --cred-file=: filepath at which to read or write the credentials
          --credentials-contents=: contents of the credentials JSON
          --post-quantum: create an experimental post-quantum secure tunnel
          --pq: create an experimental post-quantum secure tunnel
          -F, --features=*: opt into experimental features
          --token=: tunnel token
          --token-file=: filepath at which to read the tunnel token
          --max-active-flows=: maximum active private network flows
          --url=: connect to the local webserver at URL
          --hello-world: run the Hello World server
          --hostname=: set a hostname on a Cloudflare zone
          --lb-pool=: name of a load balancing pool
          --unix-socket=: path to a unix socket instead of --url
          --no-tls-verify: disable TLS verification of the origin
          --http2-origin: enable HTTP/2 origin servers
          -n, --name=: stable name to identify the tunnel
      - name: list
        description: List existing tunnels
        flags:
          -o, --output=: render output using the given format
          -d, --show-deleted: include deleted tunnels
          -n, --name=: list tunnels with the given name
          --name-prefix=: list tunnels starting with the given prefix
          --np=: list tunnels starting with the given prefix
          --exclude-name-prefix=: exclude tunnels starting with the prefix
          --enp=: exclude tunnels starting with the prefix
          -w, --when=: list tunnels active at the given time
          -i, --id=: list tunnel by ID
          --show-recently-disconnected: include recently disconnected connections
          --rd: include recently disconnected connections
          --sort-by=: sort the list by the given field
          --invert-sort: invert the sort order
        completion:
          flag:
            sort-by: ["name", "id", "createdAt", "deletedAt", "numConnections"]
      - name: ready
        description: Call the /ready endpoint and return the proper exit code
      - name: info
        description: List details about the active connectors for a tunnel
        flags:
          -o, --output=: render output using the given format
          --show-recently-disconnected: include recently disconnected connections
          --rd: include recently disconnected connections
          --sort-by=: sort the connections by the given field
          --invert-sort: invert the sort order
        completion:
          flag:
            sort-by: ["id", "startedAt", "numConnections", "version"]
      - name: delete
        description: Delete an existing tunnel by UUID or name
        flags:
          --credentials-file=: filepath at which to read or write the credentials
          --cred-file=: filepath at which to read or write the credentials
          -f, --force: delete the tunnel even if it is connected
      - name: cleanup
        description: Clean up tunnel connections
        flags:
          -c, --connector-id=: restrict cleanup to a single connector
      - name: token
        description: Fetch the credentials token for an existing tunnel
        flags:
          --credentials-file=: filepath at which to read or write the credentials
          --cred-file=: filepath at which to read or write the credentials
      - name: diag
        description: Create a diagnostic report from a local cloudflared instance
        flags:
          --metrics=: metrics server address
          --diag-container-id=: container ID or name to collect logs from
          --diag-pod-id=: Kubernetes pod to collect logs from
          --no-diag-logs: skip log collection
          --no-diag-metrics: skip metric collection
          --no-diag-system: skip system information collection
          --no-diag-runtime: skip runtime information collection
          --no-diag-network: skip network diagnostics
      - name: ingress
        description: Validate and test the tunnel ingress configuration
        commands:
          - name: validate
            description: Validate the ingress configuration
          - name: rule
            description: Check which ingress rule matches a given request URL
