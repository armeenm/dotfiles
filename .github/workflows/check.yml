name: Check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flake-check:
    name: nix flake check (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
            args: ""
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
            # nix-on-droid's hardcoded proot store path needs impure evaluation
            # (same as `nix-on-droid switch --flake` does on the device).
            args: --impure
          - system: aarch64-darwin
            runner: macos-latest
            args: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: DeterminateSystems/determinate-nix-action@v3.24.0
        with:
          extra-conf: |
            extra-substituters = https://nix-on-droid.cachix.org https://hyprland.cachix.org https://nix-community.cachix.org
            extra-trusted-public-keys = nix-on-droid.cachix.org-1:56snoMJTXmDRC1Ei24CmKoUqvHJ9XCp+nidK7qkMQrU= hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: nix flake check
        run: nix flake check --build-all ${{ matrix.args }}
