name: Check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  flake-check:
    name: nix flake check (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
            args: ""
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
            # nix-on-droid's hardcoded proot store path needs impure evaluation
            # (same as `nix-on-droid switch --flake` does on the device).
            args: --impure
          - system: aarch64-darwin
            runner: macos-latest
            args: ""
    runs-on: ${{ matrix.runner }}
    steps:
      # Actions are pinned to commit SHAs: tags are mutable, and this workflow
      # runs with the repo's cache credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo apt-get clean
          df -h /

      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
        with:
          extra-conf: |
            extra-substituters = https://cache.armeen.xyz https://nix-on-droid.cachix.org https://hyprland.cachix.org https://nix-community.cachix.org
            extra-trusted-public-keys = armeen-cache-1:l8aGtFs3ouC2LT+0zWolFYogDI0H5lD8FXork1CqNYg= nix-on-droid.cachix.org-1:56snoMJTXmDRC1Ei24CmKoUqvHJ9XCp+nidK7qkMQrU= hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      # The server only accepts OIDC pushes from master; other refs get the
      # substituter configured without attempting uploads.
      - uses: Mic92/niks3-action@6d24bc1d87acdfac8e5dc3266f7b28ae99051adf # v1.5.0
        with:
          server-url: https://niks3.armeen.xyz
          skip-push: ${{ github.ref != 'refs/heads/master' }}
          max-concurrent-uploads: 8
          drain-timeout: 1200

      - name: nix flake check
        # Determinate Nix logs into FlakeHub when OIDC is available, which adds
        # its cache as an extra substituter. This repo has no FlakeHub cache
        # entitlement, so every narinfo request returns 401. Use only our
        # caches for this invocation.
        run: |
          nix flake check --build-all ${{ matrix.args }} \
            --option substituters "https://cache.armeen.xyz https://cache.nixos.org https://nix-on-droid.cachix.org https://hyprland.cachix.org https://nix-community.cachix.org" \
            --option extra-substituters ""
